<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HandTurkey — Stats</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <div class="brand">
        <span class="brand-mark">Hand<span>Turkey</span></span>
        <span class="brand-tag">Story Warz Tracker</span>
      </div>
      <nav class="main-nav">
        <a href="index.html">Episodes</a>
        <a href="comedians.html">Guests</a>
        <a href="stats.html" class="active">Stats</a>
      </nav>
    </div>
  </header>

  <section class="hero">
    <h1>Story Warz<br /><span class="accent">by the numbers</span>.</h1>
    <p>Records, streaks, and stories, coming soon.</p>
  </section>

  <main class="page">
    <h2 class="section-title">Leaderboards</h2>
    <div class="stats-grid">
      <div class="stat-card">
        <h3 class="stat-card-title">Most Wins</h3>
        <ol class="stat-list" id="stat-most-wins"></ol>
      </div>
      <div class="stat-card">
        <h3 class="stat-card-title">Most Losses</h3>
        <ol class="stat-list" id="stat-most-losses"></ol>
      </div>
      <div class="stat-card">
        <h3 class="stat-card-title">Total Appearances</h3>
        <ol class="stat-list" id="stat-most-appearances"></ol>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    HandTurkey is an unofficial fan-made tracker for <span>Story Warz</span>. Powered by Foundry339.
  </footer>

  <script src="data/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/stats.js"></script>
</body>
</html>
